syntax = "proto3";
option go_package = "github.com/Acedyn/zorro-core/testdata/rpc";

package test.rpc;

message Ping {}
message Pong {}
message Count {
  int32 number = 1;
}

// Simple service used to test gRPC over webRTC protocol
service EchoService{
  // Basic ping pong exchange
  rpc PingPong(Ping) returns (Pong);
  // Return 10 pong
  rpc PingPongMultiple(Ping) returns (stream Pong);
  // Return the ping count
  rpc PingPongCount(stream Ping) returns (Count);
  // Return the ping count every 10 ping
  rpc PingPongMultipleCount(stream Ping) returns (stream Count);
}
